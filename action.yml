name: Corroborate
description: Check whether the claims in an issue, pull request, or report resolve against the repository.
author: corroborate

branding:
  icon: search
  color: blue

inputs:
  report:
    description: >
      The report text to check. Pass this from an expression such as
      github.event.issue.body. It is treated strictly as data.
    required: true
  repo-path:
    description: Path to the checked-out repository to verify against.
    required: false
    default: "."
  ref:
    description: Ref the report claims to describe. Defaults to the checked-out HEAD.
    required: false
    default: "HEAD"
  online:
    description: Also run tier 2 checks against public registries (CVE, CWE, RFC, links).
    required: false
    default: "false"

outputs:
  markdown:
    description: Rendered markdown, suitable for posting as a single comment.
    value: ${{ steps.run.outputs.markdown }}
  json:
    description: Full machine-readable result.
    value: ${{ steps.run.outputs.json }}
  unresolved:
    description: Number of claims that did not resolve.
    value: ${{ steps.run.outputs.unresolved }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install corroborate
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Check claims
      id: run
      shell: bash
      # The report body is untrusted text from whoever opened the issue. It is
      # passed through the environment and read from a file -- never
      # interpolated into this script, which would be a shell injection.
      env:
        CORROBORATE_REPORT: ${{ inputs.report }}
        CORROBORATE_REPO: ${{ inputs.repo-path }}
        CORROBORATE_REF: ${{ inputs.ref }}
        CORROBORATE_ONLINE: ${{ inputs.online }}
      run: |
        set -euo pipefail
        printf '%s' "$CORROBORATE_REPORT" > "$RUNNER_TEMP/report.md"

        args=(check "$RUNNER_TEMP/report.md" --repo "$CORROBORATE_REPO" --ref "$CORROBORATE_REF")
        if [ "$CORROBORATE_ONLINE" = "true" ]; then args+=(--online); fi

        corroborate "${args[@]}" --format json > "$RUNNER_TEMP/result.json"
        corroborate "${args[@]}" --format markdown > "$RUNNER_TEMP/result.md"

        # A fixed heredoc delimiter is forgeable: content that contains the
        # delimiter on its own line can close the block early and inject
        # further step outputs. The report body is attacker-controlled and
        # reaches the rendered markdown, so the delimiter is randomised.
        delim="CORROBORATE_$(openssl rand -hex 16 2>/dev/null || echo "${RANDOM}${RANDOM}${RANDOM}")"
        {
          echo "markdown<<$delim"
          cat "$RUNNER_TEMP/result.md"
          echo "$delim"
          echo "json<<$delim"
          cat "$RUNNER_TEMP/result.json"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        data = json.load(open(os.environ["RUNNER_TEMP"] + "/result.json"))
        print("unresolved=%d" % data["counts"]["not_found"])
        PY
